<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Snowfall Status</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111318;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #1b1f29;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    input, button, a.btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #2e3546;
      box-sizing: border-box;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }
    input {
      background: #111318;
      color: #fff;
      text-align: left;
    }
    button {
      background: #2b3142;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    a.btn-discord {
      background: #5865F2;
      color: #fff;
      border: none;
      font-weight: bold;
      margin-top: 14px;
    }
    .preview {
      margin-top: 18px;
      padding: 14px;
      background: #111318;
      border-radius: 10px;
      border-left: 4px solid #5865F2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Bot Snowfall Status</h2>
    <p style="color:#b5bac1; font-size:14px;">ตั้งค่าข้อความ Status ของคุณและเชื่อมต่อ Discord</p>

    <label>หัวข้อ / รายละเอียด Status</label>
    <input id="detailsInput" type="text" placeholder="เช่น กำลังฟังเพลงอยู่..." />

    <label style="display:block; margin-top:10px;">สถานะย่อย</label>
    <input id="stateInput" type="text" placeholder="เช่น Bot Snowfall" />

    <button onclick="savePreview()">อัปเดตตัวอย่าง Status</button>

    <a
      id="discordAuthBtn"
      class="btn btn-discord"
      href="#"
    >
      เชื่อมต่อ Discord (Authorize)
    </a>

    <div class="preview">
      <div><strong id="outDetails">กำลังฟังเพลงอยู่...</strong></div>
      <div id="outState" style="color:#aaa; margin-top:4px;">Bot Snowfall</div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '1573366716535406622';
    const REDIRECT_URI = encodeURIComponent('https://bot-snowfall.onrender.com/callback');
    const AUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${REDIRECT_URI}&scope=identify`;

    document.getElementById('discordAuthBtn').href = AUTH_URL;

    function savePreview() {
      const d = document.getElementById('detailsInput').value || 'กำลังฟังเพลงอยู่...';
      const s = document.getElementById('stateInput').value || 'Bot Snowfall';
      document.getElementById('outDetails').textContent = d;
      document.getElementById('outState').textContent = s;
    }
  </script>
</body>
</html>
