<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowfall — เชื่อมต่อ Discord</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1117;
      color: #f3f4f6;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #181b24;
      border: 1px solid #2a2f3d;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 16px; color: #9ca3af; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 6px; }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #32384a;
      background: #10131a;
      color: #f9fafb;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #4752c4; }
    .profile {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #11141c;
      border: 1px solid #272c3a;
      display: none;
      align-items: center;
      gap: 12px;
    }
    .profile.show { display: flex; }
    .profile img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #2a2f3d;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #fbbf24;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Snowfall</h1>
    <p>เชื่อมต่อบัญชี Discord เพื่อใช้งานร่วมกับระบบ Snowfall</p>

    <label for="scopePreset">เลือกชุดสิทธิ์ (Scope) ที่ต้องการทดสอบ</label>
    <select id="scopePreset">
      <option value="identify">พื้นฐาน (identify)</option>
      <option value="identify activities.write">พื้นฐาน + กิจกรรม (identify activities.write)</option>
      <option value="identify activities.write relationships.read">พื้นฐาน + กิจกรรม + รายชื่อเพื่อน (identify activities.write relationships.read)</option>
      <option value="custom">กำหนด Scope เองด้านล่าง</option>
    </select>

    <label for="customScope">Scope ที่จะส่งไปให้ Discord</label>
    <input id="customScope" type="text" value="identify" />

    <button class="btn" id="connectBtn" type="button">เชื่อมต่อ Discord</button>

    <div class="status" id="statusText"></div>

    <div class="profile" id="profileBox">
      <img id="avatarImg" src="" alt="Avatar" />
      <div>
        <div id="displayName" style="font-weight:600;"></div>
        <div id="userMeta" style="font-size:12px;color:#9ca3af;"></div>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '1573366716535406622';
    const REDIRECT_URI = 'https://bot-snowfall.onrender.com/callback';

    const scopePreset = document.getElementById('scopePreset');
    const customScope = document.getElementById('customScope');
    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('statusText');
    const profileBox = document.getElementById('profileBox');
    const avatarImg = document.getElementById('avatarImg');
    const displayName = document.getElementById('displayName');
    const userMeta = document.getElementById('userMeta');

    scopePreset.addEventListener('change', () => {
      if (scopePreset.value !== 'custom') {
        customScope.value = scopePreset.value;
      }
    });

    connectBtn.addEventListener('click', () => {
      const scopeValue = customScope.value.trim() || 'identify';
      const url = `https://discord.com/oauth2/authorize?client_id=${encodeURIComponent(CLIENT_ID)}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopeValue)}`;
      window.location.href = url;
    });

    const params = new URLSearchParams(window.location.search);
    const authError = params.get('auth_error');
    const userId = params.get('id');
    const username = params.get('username');
    const globalName = params.get('global_name');
    const avatar = params.get('avatar');

    if (authError) {
      statusText.textContent = `เกิดข้อผิดพลาดในการเชื่อมต่อ: ${authError}`;
    } else if (userId) {
      statusText.textContent = 'เชื่อมต่อบัญชี Discord สำเร็จแล้ว';
      profileBox.classList.add('show');
      displayName.textContent = globalName || username || 'Discord User';
      userMeta.textContent = `@${username || ''} • ID: ${userId}`;
      avatarImg.src = avatar
        ? `https://cdn.discordapp.com/avatars/${userId}/${avatar}.png?size=128`
        : `https://cdn.discordapp.com/embed/avatars/${Number(BigInt(userId) >> 22n) % 6}.png`;
    }
  </script>
</body>
</html>
