<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Snowfall Status</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111318;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1b1f29;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    input, button {
      width: 100%;
      padding: 10px 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #2e3546;
      box-sizing: border-box;
      font-size: 14px;
    }
    input {
      background: #111318;
      color: #fff;
    }
    button {
      background: #5865F2;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .preview {
      margin-top: 18px;
      padding: 14px;
      background: #111318;
      border-radius: 10px;
      border-left: 4px solid #5865F2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Bot Snowfall Status</h2>
    <p>ตั้งค่าข้อความ Status ของคุณและเชื่อมต่อ Discord</p>

    <label>หัวข้อ / รายละเอียด Status</label>
    <input id="detailsInput" type="text" placeholder="เช่น กำลังฟังเพลงอยู่..." />

    <label>สถานะย่อย</label>
    <input id="stateInput" type="text" placeholder="เช่น Bot Snowfall" />

    <button onclick="savePreview()">อัปเดตตัวอย่าง Status</button>

    <div class="preview">
      <div><strong id="outDetails">กำลังฟังเพลงอยู่...</strong></div>
      <div id="outState" style="color:#aaa; margin-top:4px;">Bot Snowfall</div>
    </div>
  </div>

  <script>
    function savePreview() {
      const d = document.getElementById('detailsInput').value || 'กำลังฟังเพลงอยู่...';
      const s = document.getElementById('stateInput').value || 'Bot Snowfall';
      document.getElementById('outDetails').textContent = d;
      document.getElementById('outState').textContent = s;
    }
  </script>
</body>
</html>
